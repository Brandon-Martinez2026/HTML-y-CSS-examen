<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="gatito.png" type="image/x-icon">
</head>
<body>
    <div class="ticket"><!-- Contenedor de ticket -->
        <div class="top"><!-- Contenedor parte de arriba -->
            <h2>Cinema</h2>
            <div class="movie-title">Movie Ticket</div><!-- TItulo -->
        </div>
        <div class="bottom"><!-- Contenedor de abajo -->
            <div class="info"><!-- Informaciuon -->
                <div>FECHA</div>
                <span>SEP 28</span>
            </div>
            <div class="info" style="text-align: center;">
                <div>HORA</div>
                <span>20:00</span>
            </div>
            <div class="info" style="text-align: right;">
                <div>ASIENTO</div>
                <span>A12</span>
            </div>
        </div>
    </div>
</body>
</html>
